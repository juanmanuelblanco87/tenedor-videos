# Hostinger → R2 (a-r2.mjs, 12/11/2026): portadas → fotos de IG → videos ya copiados, misma ruta. 2 pedidos a la vez
# contra Hostinger con pausa; frena ante 429/503 y corta a los 3 errores seguidos. Se vuelve a lanzar sola mientras
# quede trabajo (quedan > 0); el schedule cada 2 h es el respaldo (los de GitHub no son confiables en este repo).
# Apagar la cadena: variable del repo A_R2_CONTINUO = apagado. Sale siempre con 0 (sin mails de GitHub).
name: a-r2
on:
  schedule:
    - cron: "10 */2 * * *"
  workflow_dispatch:
    inputs:
      portadas: { description: "Tope de portadas", required: false, default: "20000" }
      fotos: { description: "Tope de fotos de IG", required: false, default: "8000" }
      videos: { description: "Tope de videos (×2 de noche)", required: false, default: "3000" }
      a_la_vez: { description: "Pedidos a la vez contra Hostinger", required: false, default: "3" }
concurrency:
  group: a-r2
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  hostinger:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_APP_ID: ${{ secrets.D1_APP_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    outputs:
      quedan: ${{ steps.copia.outputs.quedan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Hostinger → R2
        id: copia
        run: node a-r2.mjs --portadas ${{ inputs.portadas || '20000' }} --fotos ${{ inputs.fotos || '8000' }} --videos ${{ inputs.videos || '3000' }} --noche-x 2 --hostinger-a-la-vez ${{ inputs.a_la_vez || '3' }} --pausa 100 --minutos 100 --requiere-s3 || true
  seguir:
    needs: hostinger
    if: always() && needs.hostinger.outputs.quedan != '' && needs.hostinger.outputs.quedan != '0' && vars.A_R2_CONTINUO != 'apagado'
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run a-r2.yml -R ${{ github.repository }}
        env: { GH_TOKEN: "${{ github.token }}" }
