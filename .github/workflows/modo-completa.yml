# Primera vuelta COMPLETA de MODO (23/11/2026, promos automáticas etapa 2): todo el sitemap (≈ 14.000 fichas, ≈ 8 h a 1
# pedido cada 2,1 s; el sitemap tiene 31.825 slugs, de los que se leen los 14.330 de 2026 y sin año) para armar la lista de salteo y traer todas las vigentes de gastronomía. SÓLO A MANO, un fin de
# semana de noche (como el piloto): gh workflow run modo-completa.yml -R juanmanuelblanco87/tenedor-videos
# Tres partes en fila (nunca en paralelo: es un solo sitio), cada una con su tope de pedidos; la parte siguiente sigue
# donde quedó la anterior (estado en el cache). Las de 2020-2025 van a salteo sin leerlas. Mismas reglas que modo-diario.yml (robots,
# ritmo, corte ante 403/429/captcha, nada de /api/ ni map-handler) y el mismo interruptor: con «Lectura diaria de MODO»
# apagado en Ajustes no lee nada. Lo leído en horario de uso (12-15 y 20-24 h AR) espera en la cola y se manda después.
name: modo-completa
on:
  workflow_dispatch:
    inputs:
      tope_por_parte:
        description: "Pedidos a MODO por parte (3 partes)"
        default: "5000"
      aceptar_sitemap:
        description: "Aceptar el sitemap aunque traiga menos del 80 % de las de gastronomía conocidas (sólo si MODO lo achicó de verdad)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: modo-lector
  cancel-in-progress: false
env:
  TENEDOR_BASE: https://tenedor.com.ar
jobs:
  parte-1:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      inicio: ${{ steps.inicio.outputs.inicio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: inicio
        run: echo "inicio=$(TZ=America/Argentina/Buenos_Aires date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with: { path: estado-modo, key: "modo-estado-${{ github.run_id }}-p1", restore-keys: modo-estado- }
      - env:
          IMPORTADOR_SECRET: ${{ secrets.IMPORTADOR_SECRET }}
          TOPE: ${{ inputs.tope_por_parte }}
          ACEPTAR: ${{ inputs.aceptar_sitemap && 'si' || 'no' }}
          INICIO: ${{ steps.inicio.outputs.inicio }}
        run: node modo-diario.mjs completa --tope "$TOPE" --inicio "$INICIO" --aceptar-sitemap "$ACEPTAR"
      - if: always()
        uses: actions/cache/save@v4
        with: { path: estado-modo, key: "modo-estado-${{ github.run_id }}-${{ github.run_attempt }}-p1" }
  parte-2:
    needs: parte-1
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache/restore@v4
        with: { path: estado-modo, key: "modo-estado-${{ github.run_id }}-p2", restore-keys: modo-estado- }
      - env:
          IMPORTADOR_SECRET: ${{ secrets.IMPORTADOR_SECRET }}
          TOPE: ${{ inputs.tope_por_parte }}
          ACEPTAR: ${{ inputs.aceptar_sitemap && 'si' || 'no' }}
          INICIO: ${{ needs.parte-1.outputs.inicio }}
        run: node modo-diario.mjs completa --tope "$TOPE" --inicio "$INICIO" --aceptar-sitemap "$ACEPTAR"
      - if: always()
        uses: actions/cache/save@v4
        with: { path: estado-modo, key: "modo-estado-${{ github.run_id }}-${{ github.run_attempt }}-p2" }
  parte-3:
    needs: [parte-1, parte-2]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache/restore@v4
        with: { path: estado-modo, key: "modo-estado-${{ github.run_id }}-p3", restore-keys: modo-estado- }
      - env:
          IMPORTADOR_SECRET: ${{ secrets.IMPORTADOR_SECRET }}
          TOPE: ${{ inputs.tope_por_parte }}
          ACEPTAR: ${{ inputs.aceptar_sitemap && 'si' || 'no' }}
          INICIO: ${{ needs.parte-1.outputs.inicio }}
        run: node modo-diario.mjs completa --tope "$TOPE" --inicio "$INICIO" --aceptar-sitemap "$ACEPTAR"
      - if: always()
        uses: actions/cache/save@v4
        with: { path: estado-modo, key: "modo-estado-${{ github.run_id }}-${{ github.run_attempt }}-p3" }
