# Subidas de «Tus videos» (procesar-subida.mjs, 18/11/2026): recodifica lo que subieron los comercios (o lo que bajó de
# un link), arma las portadas, lo mide y lo deja «en revisión» para la bandeja del back. Lo dispara la app con
# workflow_dispatch al recibir una subida (PAT con sólo actions:write, R5); si el disparo falla, el cron de la app
# (tenedor-subidas) lo vuelve a disparar a los 30 min (C6). El schedule es el respaldo. Un disparo procesa todas las
# «recibida» (agrupado) y se vuelve a lanzar solo mientras queden. Apagar: variable del repo SUBIDAS = apagado.
# 19/11: el respaldo pasa de cada 2 h a cada 10 min (un link quedó horas en «recibida»: GitHub atrasa los schedule y la
# última corrida automática había sido 8 h antes). Cada corrida arranca con «revisar»: UNA consulta por el índice
# subidas_estado (hay-subidas.mjs, sin instalar nada); con la cola vacía termina ahí, en segundos. Lo pesado (ffmpeg,
# yt-dlp) sólo corre si hay algo, o si se disparó a mano / desde la app (workflow_dispatch siempre procesa).
# Log sólo con contadores (R4: el repo es público). Sale siempre con 0 (sin mails de GitHub).
name: procesar-subida
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
concurrency:
  group: procesar-subida
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  revisar:
    if: vars.SUBIDAS != 'apagado'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      hay: ${{ steps.hay.outputs.hay }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: hay-subidas.mjs, sparse-checkout-cone-mode: false }
      - name: ¿Hay subidas?
        id: hay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_APP_ID: ${{ secrets.D1_APP_ID }}
        run: node hay-subidas.mjs
  procesar:
    needs: revisar
    if: vars.SUBIDAS != 'apagado' && (github.event_name == 'workflow_dispatch' || needs.revisar.outputs.hay == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_APP_ID: ${{ secrets.D1_APP_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    outputs:
      quedan: ${{ steps.procesar.outputs.quedan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Como motor.yml: «apt-get update» puede colgarse; primero sin update y con tope de tiempo.
      - name: ffmpeg, heif-convert y yt-dlp
        timeout-minutes: 12
        run: |
          (which ffmpeg && which heif-convert) || timeout 300 sudo apt-get install -y -qq ffmpeg libheif-examples >/dev/null || (timeout 300 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg libheif-examples >/dev/null)
          pip install -q -U yt-dlp
      - name: Procesar
        id: procesar
        run: node procesar-subida.mjs --max 20 --minutos 40 || true
  seguir:
    needs: procesar
    if: always() && needs.procesar.outputs.quedan != '' && needs.procesar.outputs.quedan != '0' && vars.SUBIDAS != 'apagado'
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run procesar-subida.yml -R ${{ github.repository }}
        env: { GH_TOKEN: "${{ github.token }}" }
