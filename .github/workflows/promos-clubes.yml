# Promos automáticas · etapa 2 · CLUBES (23/11/2026): lee las fichas PÚBLICAS de gastronomía de Club La Nación y Clarín
# 365 (promos-clubes.mts + promos-clubes-lector.ts, copia idéntica de src/lib/promos-clubes-lector.ts del repo privado)
# y las manda a NUESTRO Worker (POST /api/cron/promos-clubes) de a 5, esperando cada respuesta. El Worker empareja con
# los locales y guarda SUGERENCIAS (nada se muestra solo). Este Action nunca toca la base.
#
# Ritmo y cortes: robots.txt antes de cada vuelta (si prohíbe lo que leemos, la fuente queda frenada), 1 pedido cada
# 2,1 s, corte ante 403 / 429 / captcha, tope de pedidos por corrida, user-agent genérico TenedorBot/1.0. Clarín 365 no
# tiene robots.txt (404): se respetan igual el ritmo y los cortes. Nunca búsquedas `?q=` ni mapas de sucursales.
# Frecuencia (doc §1.2): COMPLETA los domingos (≈ 130 fichas por club, ≈ 5 min cada uno) y DIARIA de comercios nuevos del
# sitemap (lunes a sábado). Arranca 03:30 AR; los clubes van uno detrás del otro (una sola ingesta por vez: el Worker
# también tiene candado).
#
# APAGADO DE ENTRADA, en dos lugares:
#   1. Variable del repo PROMOS_CLUBES_ACTIVO = "si" (Settings › Variables). Sin ella el job no corre (no lee nada).
#   2. En el Worker, Ajustes › Promos bancarias › «Promos de Club La Nación / Clarín 365». Apagado, la ingesta responde
#      «apagado» y el lector corta sin guardar nada.
# Secretos (sólo en el paso «Leer y enviar»): IMPORTADOR_SECRET (el mismo del Worker) y PROMOS_INGESTA_URL.
# Logs: SÓLO NÚMEROS. Sin artifacts. El cache guarda únicamente los slugs ya leídos (son públicos).
name: promos-clubes
on:
  schedule:
    - cron: "30 6 * * *" # 03:30 AR
  workflow_dispatch:
    inputs:
      modo:
        description: "completo | nuevos"
        default: "nuevos"
      max_pedidos:
        description: "Tope de pedidos por club"
        default: "180"
      aceptar_sitemap:
        description: "Aceptar el sitemap aunque traiga menos del 80 % de las fichas conocidas (sólo vuelta completa; sólo si el club lo achicó de verdad)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: promos-clubes
  cancel-in-progress: false
jobs:
  leer:
    if: ${{ vars.PROMOS_CLUBES_ACTIVO == 'si' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Uno detrás del otro: nunca dos ingestas en paralelo.
      max-parallel: 1
      fail-fast: false
      matrix:
        fuente: [club_la_nacion, clarin_365]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Slugs ya leídos
        uses: actions/cache/restore@v4
        with:
          path: vistos
          key: promos-clubes-${{ matrix.fuente }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: promos-clubes-${{ matrix.fuente }}-
      - name: Modo y tope (sin interpolar entradas en el script)
        id: modo
        env:
          MODO_PEDIDO: ${{ inputs.modo }}
          MAX_PEDIDO: ${{ inputs.max_pedidos }}
          ACEPTAR_PEDIDO: ${{ inputs.aceptar_sitemap && 'si' || 'no' }}
        run: |
          modo="nuevos"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(TZ=America/Argentina/Buenos_Aires date +%u)" = "7" ]; then modo="completo"; fi
          if [ "$MODO_PEDIDO" = "completo" ]; then modo="completo"; fi
          max="180"
          if printf '%s' "$MAX_PEDIDO" | grep -Eq '^[0-9]{1,3}$'; then max="$MAX_PEDIDO"; fi
          echo "modo=$modo" >> "$GITHUB_OUTPUT"
          echo "max=$max" >> "$GITHUB_OUTPUT"
          aceptar="no"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$ACEPTAR_PEDIDO" = "si" ] && [ "$modo" = "completo" ]; then aceptar="si"; fi
          echo "aceptar=$aceptar" >> "$GITHUB_OUTPUT"
      - name: Leer y enviar
        env:
          IMPORTADOR_SECRET: ${{ secrets.IMPORTADOR_SECRET }}
          PROMOS_INGESTA_URL: ${{ secrets.PROMOS_INGESTA_URL }}
        run: node --experimental-strip-types promos-clubes.mts --fuente ${{ matrix.fuente }} --modo ${{ steps.modo.outputs.modo }} --max-pedidos ${{ steps.modo.outputs.max }} --aceptar-sitemap ${{ steps.modo.outputs.aceptar }} --vistos vistos
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: vistos
          key: promos-clubes-${{ matrix.fuente }}-${{ github.run_id }}-${{ github.run_attempt }}
