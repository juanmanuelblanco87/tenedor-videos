# Prueba 2 (sólo lee, 09/11/2026): dumpor.io con Chromium sin pantalla (LiveView) como fuente de links de reels.
name: prueba-espejos2
on:
  workflow_dispatch:
    inputs:
      cuentas:
        description: "Cuántas cuentas probar"
        default: "20"
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_APP_ID: ${{ secrets.D1_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -q -U yt-dlp
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node espejos-navegador.mjs ${{ inputs.cuentas }}
