# Miniaturas de 160 px en R2 (miniaturas.mjs, 15/11/2026): una chica al lado de cada foto de fotos-ig/ y fotos-gm/, y
# rehace las portadas chicas que eran grandes. Saltea lo ya hecho. Corre acá (repo público, minutos sin tope) porque el
# repo privado se quedó sin minutos. Corre sola todos los días 07:40 AR, después de a-r2 (05:10 AR), así las fotos que pasan de Hostinger a R2 tienen su chica el mismo día (19/11) (schedule; a mano: gh workflow run miniaturas.yml).
name: miniaturas
on:
  schedule:
    - cron: "40 10 * * *"
  workflow_dispatch:
    inputs:
      max: { description: "Tope (0 = todas)", required: false, default: "0" }
concurrency:
  group: miniaturas
  cancel-in-progress: false
jobs:
  miniaturas:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-audit --no-fund sharp@0.34
      - name: Miniaturas
        run: node miniaturas.mjs --paralelo 12 --max "${{ inputs.max || '0' }}"
