# Prueba (sólo lee): perfiles públicos de Instagram sin sesión → ¿traen las publicaciones y videos recientes?
name: prueba-descubrir
on:
  workflow_dispatch:
    inputs:
      cuentas:
        description: "Cuántas cuentas probar"
        default: "20"
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_APP_ID: ${{ secrets.D1_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node descubrir-prueba.mjs ${{ inputs.cuentas }}
