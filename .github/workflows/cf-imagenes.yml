# 20/11/2026 (dueño: «OK con A»): MUDADA desde juanmanuelblanco87/tenedor (privado, frenado por el pago de GitHub)
# a este repo público (minutos gratis). El código sigue privado: se baja con una deploy key de SÓLO LECTURA
# (secreto TENEDOR_DEPLOY_KEY), rama tareas-github. Los registros de cada corrida son públicos.
# Imagen REAL de los comercios sin imagen (cascada de src/app/api/cron/imagenes: og:image de la web propia con dos votos
# de la IA de visión gratis, carta y la ficha de Google sin cargo). Dueño 03/11: «al menos 1 imagen por comercio
# gastronómico debe ser prioridad» / «adelante con todos los caminos gratis». Necesita @napi-rs/canvas: corre acá.
# Vive en main porque GitHub sólo programa los workflows de la rama principal; el código sale de `cloudflare`.
# Cada 3 h (a los :52, desfasado de cf-contenido): ~3 min por vuelta. 20/11: sin los pasos de Hostinger (ver abajo).
# Secretos: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, HOSTINGER_API_TOKEN y las claves de IA gratis
# (GEMINI_API_KEY, GROQ_API_KEY, OPENROUTER_API_KEY: las carga el dueño con cargar-claves-github.cmd).
name: cf-imagenes
on:
  schedule:
    # 13/11 (sin minutos gratis de GitHub: cada vuelta tardaba ~30 min y se comía el cupo): una vez por día, 04:52 ART.
    - cron: "52 */3 * * *"   # 20/11: cada 3 h otra vez (repo público, minutos gratis)
  workflow_dispatch:
concurrency:
  group: cf-imagenes
  cancel-in-progress: false
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 40 # 20/11: sin cartas ni portadas alcanza (imágenes ~3 min + auditoría hasta 15)
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: juanmanuelblanco87/tenedor
          ref: tareas-github
          ssh-key: ${{ secrets.TENEDOR_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Ids de las bases D1 (no son secretos; salen de wrangler.jsonc)
        run: |
          for b in app fondo hechos; do
            id=$(grep -o "\"database_name\": \"tenedor-$b\", \"database_id\": \"[0-9a-f-]*\"" wrangler.jsonc | grep -o '[0-9a-f-]\{36\}')
            test -n "$id" || { echo "sin id de tenedor-$b"; exit 1; }
            echo "D1_$(echo $b | tr a-z A-Z)_ID=$id" >> "$GITHUB_ENV"
          done
      - name: Imagen real de los comercios sin imagen
        run: npx tsx --conditions=react-server scripts/cf/fondo-github.mts --tarea imagenes
      # 06/11: el recuento nocturno de auditoría (tenedor-auditoria) no entra en la memoria del Worker (~180 MB de 128):
      # corre acá, una vez por día argentino (si ya está la fila de hoy en auditoria_historial, sale enseguida).
      # 20/11 (mapa §4, punto 6 del dueño: lo pesado de noche): sólo en las vueltas de 06:52 y 09:52 UTC (03:52 y 06:52
      # de Buenos Aires). Antes salía en la primera vuelta del día argentino (00:52), todavía con la cena en la app. La de
      # las 09:52 es el reintento: si la de las 06:52 ya la hizo, sale enseguida con su latido.
      - name: Recuento de auditoría (una vez por día, de noche)
        if: always()
        timeout-minutes: 15
        run: |
          case "$(date -u +%H)" in 06|09) ;; *) [ "${{ github.event_name }}" = workflow_dispatch ] || { echo "el recuento corre a las 06:52 y 09:52 UTC"; exit 0; } ;; esac
          npx tsx --conditions=react-server scripts/cf/auditoria-github.mts
      # 20/11 (mapa de Roberto §2.2, tanda 1; dueño: apagar en 3 tandas): se sacaron los pasos que ya no se mantienen.
      #   - fotos-ig-copia: copiaba a Hostinger (upload-urls 502); las fotos de Instagram van a R2 con a-r2-directos.
      #   - fb-fotos: rellenaba con la foto de perfil de Facebook (construcción, 0 revisados por vuelta).
      #   - Lector de cartas: duplicaba cartas.yml (el lector de cartas de verdad, 7 veces por día).
      #   - Portadas de los videos copiados: subía a Hostinger y hacía salir el trabajo en rojo.
      # Quedan la imagen real de las altas y el recuento de auditoría. Las tareas del Worker quedaron en RETIRADAS
      # (src/cf/tareas.ts del repo privado), así que tampoco alarman en Fallas.
