# Motor de videos (07/11/2026, «armá las mejoras del motor»): 4 máquinas en paralelo, cada una con su IP y su parte de
# la lista (Instagram corta a yt-dlp por IP). Se programa cada hora; cada parte sale sola si cortó por bloqueo hace
# menos de 2 h (guardián en motor.mjs), así no depende de que GitHub respete los horarios. Tandas de hasta 2,8 h.
# Repositorio público: los minutos de GitHub Actions no se cuentan. Las claves son secretos del repositorio.
name: motor
on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Tope de videos por parte (vacío = todos los que entren en el tiempo)"
        required: false
concurrency:
  group: motor
  cancel-in-progress: false
jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        parte: [0, 1, 2, 3]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_APP_ID: ${{ secrets.D1_APP_ID }}
      D1_FONDO_ID: ${{ secrets.D1_FONDO_ID }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_USUARIO: ${{ secrets.HOSTINGER_USUARIO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # 06/11: «apt-get update» se colgó 20 min (servidor de paquetes): primero sin update y con tope de tiempo.
      - name: ffmpeg y yt-dlp
        timeout-minutes: 10
        run: |
          which ffmpeg || timeout 240 sudo apt-get install -y -qq ffmpeg >/dev/null || (timeout 300 sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq ffmpeg >/dev/null)
          pip install -q -U yt-dlp
          ffmpeg -version | head -1
      - name: Videos vencidos con link nuevo (parte ${{ matrix.parte }})
        run: node motor.mjs --partes 4 --parte ${{ matrix.parte }} --minutos 165 --a-la-vez 2 --por-local 2 ${{ inputs.max && format('--max {0}', inputs.max) || '' }}
