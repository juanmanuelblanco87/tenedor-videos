# Motor de videos: corre cada 3 horas (tandas de hasta 2,8 h; Instagram suele cortar a yt-dlp a los ~450 videos) y a mano (Actions → motor → Run workflow).
# Repositorio público: los minutos de GitHub Actions no se cuentan. Las claves son secretos del repositorio.
name: motor
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Tope de videos (vacío = todos los que entren en el tiempo)"
        required: false
concurrency:
  group: motor
  cancel-in-progress: false
jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_APP_ID: ${{ secrets.D1_APP_ID }}
      D1_FONDO_ID: ${{ secrets.D1_FONDO_ID }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_USUARIO: ${{ secrets.HOSTINGER_USUARIO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: ffmpeg y yt-dlp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q -U yt-dlp
      - name: Videos vencidos con link nuevo
        run: node motor.mjs --minutos 165 --a-la-vez 2 --por-local 2 ${{ inputs.max && format('--max {0}', inputs.max) || '' }}
