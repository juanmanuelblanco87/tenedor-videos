# Motor de videos para publicaciones sueltas (17/11/2026, dueño: «descargalo con nuestra herramienta»): mismo motor.mjs,
# sólo a mano y sólo con los ids que se pasan. No tiene horario: el motor completo (motor.yml) sigue apagado.
name: motor-uno
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Ids de publicaciones separados por coma"
        required: true
jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_APP_ID: ${{ secrets.D1_APP_ID }}
      D1_FONDO_ID: ${{ secrets.D1_FONDO_ID }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_USUARIO: ${{ secrets.HOSTINGER_USUARIO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: ffmpeg y yt-dlp
        timeout-minutes: 10
        run: |
          which ffmpeg || timeout 240 sudo apt-get install -y -qq ffmpeg >/dev/null || (timeout 300 sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq ffmpeg >/dev/null)
          pip install -q -U yt-dlp
      - name: Copiar las publicaciones pedidas
        run: node motor.mjs --partes 1 --parte 0 --minutos 15 --a-la-vez 1 --por-local 6 --ids "${{ inputs.ids }}"
