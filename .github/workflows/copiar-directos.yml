# Copia de videos con link directo vigente (09/11/2026): los elegidos que trae el lector de anonyig ya vienen con el MP4
# directo. motor.mjs --solo-directos los baja, achica y sube a Hostinger SIN pedirle nada a Instagram (no hay bloqueos
# por IP), así que puede correr cada 20 min (lo lanza la vigilancia; el schedule de GitHub no es confiable).
name: copiar-directos
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
concurrency:
  group: copiar-directos
  cancel-in-progress: false
jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_APP_ID: ${{ secrets.D1_APP_ID }}
      D1_FONDO_ID: ${{ secrets.D1_FONDO_ID }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_USUARIO: ${{ secrets.HOSTINGER_USUARIO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: ffmpeg
        timeout-minutes: 10
        run: which ffmpeg || timeout 240 sudo apt-get install -y -qq ffmpeg >/dev/null || (timeout 300 sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq ffmpeg >/dev/null)
      - name: Copiar directos (parte ${{ matrix.parte }})
        run: node motor.mjs --solo-directos --partes 2 --parte ${{ matrix.parte }} --minutos 18 --a-la-vez 3 --por-local 6
